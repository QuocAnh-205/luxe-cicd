name: Backend CI/CD Pipeline

on:
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "database/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "database/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci-cd.yml"
  # Cho phép bấm "Run workflow" để deploy tay trên tab Actions
  workflow_dispatch:

jobs:
  # ==========================================
  #  CI JOB — build & test (chạy cả khi tạo PR lẫn trước khi deploy)
  # ==========================================
  ci-build:
    name: CI – Build & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build (TypeScript nếu có)
        run: npm run build --if-present

      - name: Run Tests
        run: npm test --if-present

      - name: Test Docker Build
        run: docker build -t luxe-backend-test .

  # ==========================================
  #  CD JOB — deploy lên EC2 khi merge/push vào main
  # ==========================================
  cd-deploy:
    name: CD – Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: ci-build
    # Tài liệu gốc để ci-build chỉ chạy khi PR => khi push, ci-build bị skip và cd-deploy
    # (needs: ci-build) cũng bị skip theo. Ở đây ci-build chạy mọi event, cd-deploy chỉ chạy khi push main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Không cho backend & frontend deploy cùng lúc (cùng git pull / docker compose trên 1 máy)
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/luxe
            git pull --ff-only origin main
            docker compose build backend
            docker compose up -d mysql backend
            docker image prune -f
            docker compose ps
