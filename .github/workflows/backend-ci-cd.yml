name: Backend CI/CD Pipeline

on:
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "database/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci-cd.yml"
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "database/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci-cd.yml"
  # Cho phép bấm "Run workflow" để deploy tay trên tab Actions
  workflow_dispatch:

jobs:
  # ==========================================
  #  CI JOB — build & test (chạy cả khi tạo PR lẫn trước khi deploy)
  # ==========================================
  ci-build:
    name: CI – Build & Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build (TypeScript nếu có)
        run: npm run build --if-present

      - name: Run Tests
        run: npm test --if-present

      - name: Test Docker Build
        run: docker build -t luxe-backend-test .

  # ==========================================
  #  CD JOB — deploy lên EC2 khi merge/push vào main
  # ==========================================
  cd-deploy:
    name: CD – Deploy Backend to EC2
    runs-on: ubuntu-latest
    needs: ci-build
    # Tài liệu gốc để ci-build chỉ chạy khi PR => khi push, ci-build bị skip và cd-deploy
    # (needs: ci-build) cũng bị skip theo. Ở đây ci-build chạy mọi event, cd-deploy chỉ chạy khi push main.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Không cho backend & frontend deploy cùng lúc (cùng git pull / docker compose trên 1 máy)
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    # id-token: write để đăng nhập AWS bằng OIDC (không lưu access key trong GitHub)
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-southeast-1
      SG_ID: ${{ vars.AWS_SG_ID }}

    steps:
      # Cổng 22 của EC2 bình thường chỉ mở cho IP quản trị. Chỉ mở cho IP runner này trong lúc deploy.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Open SSH for this runner
        run: |
          IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "RUNNER_IP=$IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$IP/32,Description=github-actions-deploy}]" \
            || echo "Rule đã tồn tại"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/luxe
            git pull --ff-only origin main
            docker compose build backend
            docker compose up -d mysql backend
            docker image prune -f
            docker compose ps

      - name: Close SSH for this runner
        if: always() && env.RUNNER_IP != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32}]"
