name: Database Backup

# Sao lưu MySQL trên EC2 mỗi đêm lúc 02:00 giờ Việt Nam (19:00 UTC).
# File nén lưu ở ~/backups trên EC2, giữ 7 bản mới nhất.
# Khôi phục: xem mục "Sao lưu & khôi phục database" trong DEPLOY-EC2.md
on:
  schedule:
    - cron: "0 19 * * *"
  # Bấm "Run workflow" trên tab Actions để sao lưu ngay
  workflow_dispatch:

jobs:
  backup:
    name: Backup MySQL on EC2
    runs-on: ubuntu-latest
    # Dùng chung nhóm với deploy để không mở/đóng cổng SSH chồng nhau
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-southeast-1
      SG_ID: ${{ vars.AWS_SG_ID }}

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Open SSH for this runner
        run: |
          IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "RUNNER_IP=$IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$IP/32,Description=github-actions-deploy}]" \
            || echo "Rule đã tồn tại"

      - name: Dump database via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eo pipefail
            cd ~/luxe
            set -a; . ./.env; set +a
            mkdir -p ~/backups && chmod 700 ~/backups
            F=~/backups/luxe_$(TZ=Asia/Ho_Chi_Minh date +%F_%H%M).sql.gz
            docker exec -e MYSQL_PWD="$MYSQL_ROOT_PASSWORD" luxe-mysql \
              mysqldump -uroot --single-transaction --routines --default-character-set=utf8mb4 \
              "${MYSQL_DATABASE:-luxe_fashion}" | gzip > "$F"
            # Kiểm tra file nén hợp lệ và có dữ liệu bảng products
            gzip -t "$F"
            zcat "$F" | grep -q "INSERT INTO \`products\`"
            chmod 600 "$F"
            # Giữ 7 bản mới nhất
            ls -1t ~/backups/luxe_*.sql.gz | tail -n +8 | xargs -r rm --
            echo ">> Đã sao lưu: $F"
            ls -lh ~/backups

      - name: Close SSH for this runner
        if: always() && env.RUNNER_IP != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32}]"
