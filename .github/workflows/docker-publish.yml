name: "[Phương án B] Docker Hub Build, Push & Deploy EC2"

# PHƯƠNG ÁN B (tuỳ chọn): build image trên GitHub Actions → push Docker Hub → EC2 chỉ pull.
# Mặc định chỉ chạy tay (tab Actions → Run workflow) để không đụng với Phương án A
# (backend-ci-cd.yml / frontend-ci-cd.yml build trực tiếp trên EC2 theo tài liệu).
# Muốn dùng phương án B làm mặc định: thêm lại trigger `push: branches: [main]` ở đây
# và xoá trigger `push` trong 2 workflow kia.
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/luxe-fashion-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/luxe-fashion-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          # Để trống khi deploy EC2: frontend gọi cùng origin, nginx proxy /api/ -> backend
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/luxe-fashion-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/luxe-fashion-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-ec2:
    runs-on: ubuntu-latest
    needs: build-and-push
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false

    steps:
      - name: Pull images & restart containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/luxe
            # Lấy docker-compose.prod.yml + database/init mới nhất
            git pull --ff-only origin main
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
