name: Frontend CI/CD Pipeline

on:
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
  workflow_dispatch:

jobs:
  # ============================
  #  CI — build frontend (PR và trước khi deploy)
  # ============================
  ci-build:
    name: CI – Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run Tests
        run: npm test --if-present

      - name: Build React App
        run: npm run build
        env:
          # Giống lúc build trong Docker: để trống để gọi /api cùng origin
          VITE_API_URL: ""

      - name: Test Docker Build
        run: docker build --build-arg VITE_API_URL= -t luxe-frontend-test .

  # ============================
  #  CD — deploy khi merge/push main
  # ============================
  cd-deploy:
    name: CD – Deploy Frontend to EC2
    runs-on: ubuntu-latest
    needs: ci-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/luxe
            git pull --ff-only origin main
            docker compose build frontend
            docker compose up -d frontend
            docker image prune -f
            docker compose ps
