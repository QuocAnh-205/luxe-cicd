name: Frontend CI/CD Pipeline

on:
  pull_request:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci-cd.yml"
  workflow_dispatch:

jobs:
  # ============================
  #  CI — build frontend (PR và trước khi deploy)
  # ============================
  ci-build:
    name: CI – Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run Tests
        run: npm test --if-present

      - name: Build React App
        run: npm run build
        env:
          # Giống lúc build trong Docker: để trống để gọi /api cùng origin
          VITE_API_URL: ""

      - name: Test Docker Build
        run: docker build --build-arg VITE_API_URL= -t luxe-frontend-test .

  # ============================
  #  CD — deploy khi merge/push main
  # ============================
  cd-deploy:
    name: CD – Deploy Frontend to EC2
    runs-on: ubuntu-latest
    needs: ci-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    # id-token: write để đăng nhập AWS bằng OIDC (không lưu access key trong GitHub)
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-southeast-1
      SG_ID: ${{ vars.AWS_SG_ID }}

    steps:
      # Cổng 22 của EC2 bình thường chỉ mở cho IP quản trị. Chỉ mở cho IP runner này trong lúc deploy.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Open SSH for this runner
        run: |
          IP=$(curl -fsS https://checkip.amazonaws.com)
          echo "RUNNER_IP=$IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$IP/32,Description=github-actions-deploy}]" \
            || echo "Rule đã tồn tại"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd ~/luxe
            git pull --ff-only origin main
            docker compose build frontend
            docker compose up -d frontend
            docker image prune -f
            docker compose ps

      - name: Close SSH for this runner
        if: always() && env.RUNNER_IP != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP/32}]"
