# docker-compose.prod.yml — PHƯƠNG ÁN B (tuỳ chọn)
# EC2 KHÔNG build, chỉ pull image đã được GitHub Actions (docker-publish.yml) build sẵn
# và push lên Docker Hub. Hợp với EC2 yếu (t2/t3.micro) vì build trên máy dễ hết RAM.
# Dùng chung file ~/luxe/.env với docker-compose.yml, cần thêm DOCKER_USERNAME.
# (IMAGE_TAG được workflow truyền vào khi deploy, mặc định là latest)
#
# KHÔNG chạy song song với docker-compose.yml (trùng container_name). Muốn chuyển:
#   docker compose down && docker compose -f docker-compose.prod.yml up -d
# Dữ liệu MySQL dùng chung volume "luxe_mysql_data" nên không mất khi chuyển phương án.

name: luxe

services:
  mysql:
    image: mysql:8.0
    container_name: luxe-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-luxe_fashion}
      MYSQL_USER: ${MYSQL_USER:-luxe_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --performance_schema=OFF
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_BIND:-0.0.0.0}:${MYSQL_PUBLIC_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  backend:
    image: ${DOCKER_USERNAME:?DOCKER_USERNAME is required}/luxe-fashion-backend:${IMAGE_TAG:-latest}
    container_name: luxe-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${MYSQL_USER:-luxe_user}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-luxe_fashion}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # Gửi email OTP quên mật khẩu: ses | smtp | (trống = chỉ ghi log)
      MAIL_PROVIDER: ${MAIL_PROVIDER:-}
      MAIL_FROM: ${MAIL_FROM:-LUXE <no-reply@luxe.vn>}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      OTP_DEBUG: ${OTP_DEBUG:-false}
    # Chỉ truy cập từ chính EC2 (curl localhost:5000), Internet đi qua nginx /api/
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"

  frontend:
    image: ${DOCKER_USERNAME}/luxe-fashion-frontend:${IMAGE_TAG:-latest}
    container_name: luxe-frontend
    restart: always
    depends_on:
      - backend
    environment:
      PORT: 80
      BACKEND_URL: http://backend:5000
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql_data:
